name: DMG Test

on:
  push:
    branches: [feature/dmg-design]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FlipScroll-dmg-test
          path: build/*.dmg
